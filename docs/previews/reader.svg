<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" role="img" aria-label="Lyrica reader: illustrated design preview, not a simulator screenshot"><title>Lyrica reader — design preview</title><rect x="0" y="0" width="430" height="932" rx="32" fill="#F7F5EF" stroke="none"/><text x="30" y="36" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#25251F" text-anchor="start">9:41</text><rect x="164" y="16" width="102" height="28" rx="18" fill="#25251F" stroke="none"/><text x="391" y="36" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#25251F" text-anchor="end">▰</text><text x="26" y="91" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="32" font-weight="400" fill="#AF4B35" text-anchor="start">‹</text><text x="52" y="87" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#AF4B35" text-anchor="start">Search</text><text x="398" y="89" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#AF4B35" text-anchor="end">♡</text><rect x="26" y="112" width="82" height="82" rx="10" fill="#C77F5B" stroke="none"/><circle cx="87.5" cy="134.96" r="22.96" fill="#EDCBA3"/><path d="M26,177.60000000000002 Q62.9,136.6 108,169.4 V194 H26Z" fill="#6B554B"/><text x="125" y="140" font-family="Georgia, serif" font-size="24" font-weight="400" fill="#25251F" text-anchor="start">Luna de papel</text><text x="125" y="168" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#78776E" text-anchor="start">Mar Sol · Original demo</text><text x="125" y="190" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#78776E" text-anchor="start">3:24 · Lyrics reader</text><rect x="24" y="222" width="382" height="50" rx="14" fill="#EDEAE2" stroke="none"/><text x="42" y="253" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#25251F" text-anchor="start">Spanish</text><text x="209" y="253" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#78776E" text-anchor="middle">→</text><text x="234" y="253" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#AF4B35" text-anchor="start">English</text><text x="385" y="253" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#AF4B35" text-anchor="end">⌄</text><text x="27" y="309" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#78776E" text-anchor="start">ORIGINAL</text><text x="231" y="309" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#AF4B35" text-anchor="start">TRANSLATION</text><path d="M215 332 V724" stroke="#E5E1D8"/><text x="27" y="354" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#25251F" text-anchor="start">La luna guarda</text><text x="27" y="381" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#25251F" text-anchor="start">mi canción.</text><text x="231" y="354" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#66655C" text-anchor="start">The moon keeps</text><text x="231" y="381" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#66655C" text-anchor="start">my song.</text><text x="27" y="430" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#25251F" text-anchor="start">Camino lento</text><text x="27" y="457" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#25251F" text-anchor="start">hacia el sol.</text><text x="231" y="430" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#66655C" text-anchor="start">I walk slowly</text><text x="231" y="457" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#66655C" text-anchor="start">toward the sun.</text><rect x="17" y="506" width="396" height="52" rx="10" fill="#EADDD1" stroke="none"/><text x="27" y="531" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#25251F" text-anchor="start">Si cambia el viento,</text><text x="231" y="531" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#AF4B35" text-anchor="start">If the wind changes,</text><text x="27" y="580" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#25251F" text-anchor="start">me quedo aquí.</text><text x="231" y="580" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#66655C" text-anchor="start">I stay right here.</text><text x="27" y="629" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#25251F" text-anchor="start">En cada palabra,</text><text x="231" y="629" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#66655C" text-anchor="start">In every word,</text><text x="27" y="678" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#25251F" text-anchor="start">un mundo para ti.</text><text x="231" y="678" font-family="Georgia, serif" font-size="18" font-weight="400" fill="#66655C" text-anchor="start">a world for you.</text><text x="27" y="779" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#78776E" text-anchor="start">Tap a line to keep your place.</text><text x="27" y="803" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#78776E" text-anchor="start">Demo lyrics written for this preview.</text><rect x="24" y="839" width="382" height="51" rx="16" fill="#EDEAE2" stroke="none"/><text x="42" y="871" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#25251F" text-anchor="start">Aa</text><text x="130" y="870" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#78776E" text-anchor="start">Side by side</text><text x="380" y="870" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#78776E" text-anchor="end">⋮</text><rect x="150" y="916" width="130" height="5" rx="3" fill="#25251F" stroke="none"/></svg>
