<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f9" />
    <meta
      name="description"
      content="Search songs and read lyrics alongside on-device translations. Free, with no account required."
    />
    <title>Lyrica — Lyrics &amp; translations</title>
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
    <script>
      // Apply a chosen theme before first paint; IndexedDB settings load later.
      try {
        const theme = localStorage.getItem("lyrica-theme");
        if (theme === "light" || theme === "dark")
          document.documentElement.dataset.theme = theme;
        // Match the browser bar to the canvas (#f6f6f9 / #0b0b0d) before first paint; app.mjs keeps it in sync.
        const dark = theme
          ? theme === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#0b0b0d"
          : "#f6f6f9";
      } catch {}
    </script>
    <script type="module" src="app.mjs"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="shell">
      <header class="app-header">
        <div class="header-inner">
          <a class="brand" href="#search" aria-label="Lyrica home">Lyrica</a>
          <nav aria-label="Main navigation">
            <a href="#search" data-nav="search"
              ><span data-icon="search"></span><span>Search</span></a
            >
            <a href="#library" data-nav="library"
              ><span data-icon="library"></span><span>Library</span></a
            >
            <a href="#settings" data-nav="settings"
              ><span data-icon="settings"></span><span>Settings</span></a
            >
          </nav>
          <a
            class="iphone-link"
            href="https://github.com/Kerollosl/lyrica"
            target="_blank"
            rel="noopener"
            >iPhone app on GitHub <span data-icon="external"></span
          ></a>
        </div>
      </header>
      <div class="workspace">
        <main id="main" tabindex="-1"></main>
        <footer class="page-footer">
          <span>Lyrica</span
          ><span
            >Lyrics from
            <a href="https://lrclib.net" target="_blank" rel="noopener"
              >LRCLIB</a
            >
            · Metadata from iTunes</span
          >
        </footer>
      </div>
    </div>
    <dialog id="dialog"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="announcer" class="visually-hidden" aria-live="polite"></div>
    <noscript
      >Lyrica needs JavaScript to search songs and display lyrics. No account is
      required.</noscript
    >
  </body>
</html>
