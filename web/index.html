<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f7f7f4" />
    <meta
      name="description"
      content="Find a song. Discover its meaning. Lyrica is a free bilingual lyrics reader with private, on-device translation in supported browsers."
    />
    <title>Lyrica — Words, a little closer.</title>
    <link rel="icon" href="icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link
      rel="preload"
      href="fonts/manrope-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.mjs"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="shell">
      <header class="app-header">
        <div class="header-inner">
          <a class="brand" href="#search" aria-label="Lyrica home"
            ><span class="brand-symbol" aria-hidden="true"
              ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              >
                <path
                  d="M5 5h5M5 10h5M5 15h3m6-10h5m-5 5h5m-5 5h3"
                /></svg></span
            >lyrica</a
          >
          <nav aria-label="Main navigation">
            <a href="#search" data-nav="search"
              ><span data-icon="search"></span><span>Discover</span></a
            >
            <a href="#library" data-nav="library"
              ><span data-icon="library"></span><span>Your library</span
              ><small id="library-count">0</small></a
            >
            <a href="#settings" data-nav="settings"
              ><span data-icon="settings"></span><span>Settings</span></a
            >
          </nav>
          <a
            class="iphone-link"
            href="https://github.com/Kerollosl/lyrica"
            target="_blank"
            rel="noopener"
            >Made for iPhone, too <span data-icon="external"></span
          ></a>
        </div>
      </header>
      <div class="workspace">
        <main id="main" tabindex="-1"></main>
        <footer class="page-footer">
          <span>Lyrica. A little closer to the words.</span
          ><span>Free. Private. Yours.</span>
        </footer>
      </div>
    </div>
    <dialog id="dialog"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript
      >Lyrica needs JavaScript to search songs and display lyrics. No account is
      required.</noscript
    >
  </body>
</html>
